<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a1628">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login — Sam & Sofía Wedding</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-emblem">♥</div>
    <div class="login-title">Admin Panel</div>
    <p class="login-sub">Sam &amp; Sofía Wedding</p>

    <form id="login-form" autocomplete="off">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="login-email" placeholder="admin@yourmail.com" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="login-password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <p class="login-error" id="login-error"></p>
      <button type="submit" class="btn-primary" id="login-btn">Login</button>
    </form>

    <button id="admin-install-btn" class="install-btn" onclick="installAdminApp()">
      📲 Install Admin App
    </button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/install.js"></script>

  <script>
    // If already logged in, skip straight to the dashboard
    firebase.auth().onAuthStateChanged(user => {
      if (user) window.location.href = 'dashboard.html';
    });

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errorEl  = document.getElementById('login-error');
      const btn      = document.getElementById('login-btn');

      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(() => { window.location.href = 'dashboard.html'; })
        .catch(err => {
          errorEl.textContent = friendlyAuthError(err.code);
          btn.disabled = false;
          btn.textContent = 'Login';
        });
    });
  </script>

</body>
</html>
